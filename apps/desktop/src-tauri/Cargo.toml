[package]
name = "quantforge-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "quantforge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "quantforge-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
quantforge-core.workspace = true
quantforge-broker.workspace = true
quantforge-data.workspace = true
quantforge-discover.workspace = true
quantforge-eval.workspace = true
quantforge-export-mql5.workspace = true
quantforge-ir.workspace = true
quantforge-parity.workspace = true
quantforge-portfolio.workspace = true
quantforge-quality.workspace = true
quantforge-storage.workspace = true
quantforge-tick.workspace = true
chrono.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
