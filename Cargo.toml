[workspace]
members = [
    "crates/quantforge-core",
    "crates/quantforge-data",
    "crates/quantforge-broker",
    "crates/quantforge-ir",
    "crates/quantforge-eval",
    "crates/quantforge-sqx",
    "crates/quantforge-tick",
    "crates/quantforge-quality",
    "crates/quantforge-discover",
    "crates/quantforge-parity",
    "crates/quantforge-export-mql5",
    "crates/quantforge-portfolio",
    "crates/quantforge-storage",
    "crates/quantforge-cli",
    "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
csv = "1"
hex = "0.4"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"

quantforge-core = { path = "crates/quantforge-core" }
quantforge-data = { path = "crates/quantforge-data" }
quantforge-broker = { path = "crates/quantforge-broker" }
quantforge-ir = { path = "crates/quantforge-ir" }
quantforge-eval = { path = "crates/quantforge-eval" }
quantforge-sqx = { path = "crates/quantforge-sqx" }
quantforge-tick = { path = "crates/quantforge-tick" }
quantforge-quality = { path = "crates/quantforge-quality" }
quantforge-discover = { path = "crates/quantforge-discover" }
quantforge-parity = { path = "crates/quantforge-parity" }
quantforge-export-mql5 = { path = "crates/quantforge-export-mql5" }
quantforge-portfolio = { path = "crates/quantforge-portfolio" }
quantforge-storage = { path = "crates/quantforge-storage" }
