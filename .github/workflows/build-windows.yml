# Windows x86_64 (Intel/AMD) installer for QuantForge.
# Trigger: Actions → "Build Windows x64" → Run workflow
# Artifact: QuantForge-windows-x64 (NSIS .exe and/or MSI)

name: Build Windows x64

on:
  workflow_dispatch:
  # Also run on this branch so the first Windows build works before the
  # workflow exists on the repo default branch (workflow_dispatch requires that).
  push:
    branches:
      - cursor/is-oos1-oos2-parallel-challenge
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build QuantForge (Windows x64 release)
        working-directory: apps/desktop
        run: pnpm tauri build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: QuantForge-windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/quantforge-desktop.exe
          if-no-files-found: error
          retention-days: 30
